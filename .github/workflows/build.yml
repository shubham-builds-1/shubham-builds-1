name: Rebuild profile

# Runs whenever you change profile.json (or build.py), and can also be started by hand
# from the Actions tab. It regenerates the images and README and commits them for you.
on:
  push:
    paths:
      - "profile.json"
      - "build.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python build.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Rebuild profile from profile.json" && git push)
