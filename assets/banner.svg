 <circle cx="930" cy="230" r="110" fill="url(#glow)" opacity=".6"><animateTransform attributeName="transform" type="translate" values="0 0;-40 -18;0 0" dur="9s" repeatCount="indefinite"/></circle>
 <circle cx="560" cy="250" r="90" fill="url(#glow)" opacity=".35"><animateTransform attributeName="transform" type="translate" values="0 0;30 -14;0 0" dur="11s" repeatCount="indefinite"/></circle>
