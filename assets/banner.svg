 <text x="64" y="70" font-family="'SF Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="14" letter-spacing="3" fill="#8fa8ad">B.TECH  ·  MATHEMATICS &amp; COMPUTING  ·  DTU</text>
 <text x="62" y="140" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="2" fill="#eaf4f4">SHUBHAM</text>
 <rect x="64" y="154" width="86" height="4" rx="2" fill="#2ec4b6"/>
 <g clip-path="url(#c0)"><text x="64" y="205" font-family="'SF Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="21" fill="#2ec4b6">&gt; Machine learning, from raw data to a deployed app</text></g><g clip-path="url(#c1)"><text x="64" y="205" font-family="'SF Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="21" fill="#2ec4b6">&gt; Demand forecasting  ·  inventory optimization</text></g><g clip-path="url(#c2)"><text x="64" y="205" font-family="'SF Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="21" fill="#2ec4b6">&gt; Building offline-first tools for disasters and scams</text></g>
 <g transform="translate(700,26)">
  <rect width="272" height="34" rx="17" fill="#ffffff" fill-opacity=".06" stroke="#2ec4b6" stroke-opacity=".5"/>
  <circle cx="20" cy="17" r="5" fill="#2ec4b6"><animate attributeName="opacity" values="1;.25;1" dur="1.8s" repeatCount="indefinite"/></circle>
  <text x="36" y="22" font-family="'SF Mono', Consolas, Menlo, 'DejaVu Sans Mono', monospace" font-size="13" letter-spacing="1.5" fill="#eaf4f4">OPEN TO INTERNSHIPS</text>
